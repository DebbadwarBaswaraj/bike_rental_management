{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card border-0 shadow-sm p-5 rounded-4">
                <i class="bi bi-compass text-muted mb-3" style="font-size: 4rem;"></i>
                <h1 class="display-5 fw-bold text-dark">404</h1>
                <h3 class="fw-semibold text-secondary mb-3">Page Not Found</h3>
                <p class="text-muted mb-4">
                    The bike trail you're looking for doesn't exist or has moved. Let's get you back on track!
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-rounded px-4">
                        <i class="bi bi-house me-1"></i> Return Home
                    </a>
                    <a href="{{ url_for('bikes.bike_list') }}" class="btn btn-outline-secondary btn-rounded px-4">
                        <i class="bi bi-bicycle me-1"></i> Browse Fleet
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
