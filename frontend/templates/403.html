{% extends "base.html" %}

{% block title %}Access Denied (403){% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card border-0 shadow-sm p-5 rounded-4">
                <i class="bi bi-shield-slash text-danger mb-3" style="font-size: 4rem;"></i>
                <h1 class="display-5 fw-bold text-dark">403</h1>
                <h3 class="fw-semibold text-danger mb-3">Access Denied</h3>
                <p class="text-muted mb-4">
                    You do not have the necessary permissions to access this administrative area or confidential reservation.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-rounded px-4">
                        <i class="bi bi-house me-1"></i> Return Home
                    </a>
                    <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary btn-rounded px-4">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign in as Admin
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
