{% extends "base.html" %}

{% block title %}Internal Server Error (500){% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card border-0 shadow-sm p-5 rounded-4">
                <i class="bi bi-gear-wide-connected text-warning mb-3" style="font-size: 4rem;"></i>
                <h1 class="display-5 fw-bold text-dark">500</h1>
                <h3 class="fw-semibold text-secondary mb-3">Internal Server Error</h3>
                <p class="text-muted mb-4">
                    Something went wrong on our server. Don't worry—our automated error logging caught it and our engineers are tuning the gears.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-rounded px-4">
                        <i class="bi bi-house me-1"></i> Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
